name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: SQLite and TLS fixture tools
        run: sudo apt-get update && sudo apt-get install -y sqlite3 openssl

      # Offline tests use only fake upstream responses and loopback HTTPS.
      - name: unit tests
        run: npm test

      - name: syntax check
        run: |
          sh -n install.sh
          for file in skills/*/scripts/*.sh; do bash -n "$file"; done
          for file in src/*.mjs src/lib/*.mjs test/*.mjs test/fixtures/*.mjs scripts/stress/*.mjs packaging/*.ts; do node --check "$file"; done

      # Boots the proxy without a session file and exercises the HTTP surface.
      - name: boot and smoke test
        run: |
          node src/proxy.mjs &
          proxy=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3456/health >/dev/null && break
            sleep 0.5
          done
          SMOKE_REQUIRE=0 node test/smoke.mjs
          kill "$proxy"

      - name: doctor runs
        run: node src/doctor.mjs || true

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: SQLite fixture tool
        run: choco install sqlite --no-progress -y
      - name: unit tests (including Windows ACL and loopback HTTP)
        run: npm test
      - name: PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in @('install.ps1', 'login.ps1', 'start.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
